name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Only runs on same-repo PRs; fork PRs lack secrets and write access
    if: >
      github.event_name == 'issue_comment' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
      CLAUDE_MAX_TURNS: ${{ vars.CLAUDE_REVIEW_MAX_TURNS || 10 }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      ARTIFACT_NAME: claude-review-summary
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-action@2c39411c224657eb2c2b9a146083fd021d72e970 # v1
        if: github.event_name == 'pull_request'
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: |
            {
              "permissions": {
                "allow": ["Bash(gh pr comment:*)", "Bash(gh pr diff:*)", "Bash(gh pr view:*)"],
                "deny": []
              }
            }
          max_turns: ${{ env.CLAUDE_MAX_TURNS }}
          claude_args: --model ${{ env.CLAUDE_MODEL }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Run `gh pr diff ${{ env.PR_NUMBER }}` to get the diff, then review ONLY the changes introduced by this PR — do not review pre-existing code that was not modified.

            Post a single comment using:
            gh pr comment ${{ env.PR_NUMBER }} --body "..."

            The comment must follow this exact structure:

            <!-- claude-review-${{ github.run_id }} -->
            <short summary of 3-5 bullet points, each prefixed with the appropriate severity emoji>

            📄 [Download full review](ARTIFACT_URL_PLACEHOLDER)

            <details>
            <summary>Full review</summary>

            ## What Changed
            <concise description of what the diff introduces>

            ## Findings

            Use these severity levels, matching the Claude Code Review format:
            - 🔴 **Important** — a bug that should be fixed before merging
            - 🟡 **Nit** — a minor issue, worth fixing but not blocking
            - 🟣 **Pre-existing** — a bug that exists but was not introduced by this PR

            For each finding include a file and line reference in this format: `file.java:42`

            | Severity | Location | Issue |
            |----------|----------|-------|
            | 🔴 Important | `path/to/File.java:12` | Description |
            | 🟡 Nit | `path/to/File.java:34` | Description |

            If no findings, write "No issues found."

            ## Verdict
            <one line: Approve / Request Changes / Needs Discussion>

            ## Full Review
            <complete narrative review scoped to the diff>

            </details>

            Use the literal text ARTIFACT_URL_PLACEHOLDER for the download link.
            Only post via gh — do not output the review as a message.

      - name: Save review as artifact
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="claude-review-${{ github.run_id }}"
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ env.PR_NUMBER }}/comments \
            | jq --arg marker "$MARKER" '[.[] | select(.body | contains($marker))] | last | .id')

          if [ -z "$COMMENT_ID" ] || [ "$COMMENT_ID" = "null" ]; then
            gh pr comment ${{ env.PR_NUMBER }} \
              --body "❌ **Claude review failed** — no comment was posted. Check your Anthropic API credits or [view the action logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo "::error::Claude did not post a review comment. Check API credits or action logs."
            exit 1
          fi

          echo "COMMENT_ID=$COMMENT_ID" >> $GITHUB_ENV
          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID \
            --jq '.body' > review-summary.md

      - name: Upload review summary
        if: github.event_name == 'pull_request' && env.COMMENT_ID != ''
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: review-summary.md
          if-no-files-found: warn

      - name: Update comment with artifact link
        if: github.event_name == 'pull_request' && env.COMMENT_ID != '' && steps.upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ env.COMMENT_ID }} \
            --jq '.body' \
            | python3 -c "
          import sys, os
          body = sys.stdin.read()
          url = os.environ['ARTIFACT_URL']
          print(body.replace('ARTIFACT_URL_PLACEHOLDER', url))
          " > updated_body.md

          gh api repos/${{ github.repository }}/issues/comments/${{ env.COMMENT_ID }} \
            -X PATCH --field body=@updated_body.md

      - uses: anthropics/claude-code-action@2c39411c224657eb2c2b9a146083fd021d72e970 # v1
        if: >
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@claude')
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: |
            {
              "permissions": {
                "allow": ["Bash(gh pr comment:*)", "Bash(gh pr diff:*)", "Bash(gh pr view:*)"],
                "deny": []
              }
            }
          max_turns: ${{ env.CLAUDE_MAX_TURNS }}
          claude_args: --model ${{ env.CLAUDE_MODEL }}
          prompt: |
            A user commented "@claude" on PR #${{ env.PR_NUMBER }} in ${{ github.repository }}.

            Their comment: ${{ github.event.comment.body }}

            Respond helpfully in the context of this pull request. Use:
            gh pr comment ${{ env.PR_NUMBER }} --body "..."
            to post your reply. Only post via gh — do not output as a message.
