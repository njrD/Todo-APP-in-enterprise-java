name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-action@v1
        if: github.event_name == 'pull_request'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Please review this pull request. Cover:
            - What the PR does (brief summary)
            - Code quality and correctness
            - Potential bugs or edge cases
            - Security concerns
            - Suggestions for improvement

            After writing the PR comment, also write a file called `review-summary.md` in the current directory with an LLM-friendly version of the review. Structure it as:

            ```
            # PR Review Summary

            ## Context
            <repo, PR number, title, author, date>

            ## What Changed
            <concise description of the diff>

            ## Findings
            ### Critical
            <list or "None">
            ### Warnings
            <list or "None">
            ### Suggestions
            <list or "None">

            ## Verdict
            <one line: Approve / Request Changes / Needs Discussion>

            ## Full Review
            <the complete review text>
            ```

            Mention in the PR comment that a downloadable LLM-friendly summary is attached as a workflow artifact named `claude-review-summary`.

      - name: Upload review summary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-summary
          path: review-summary.md
          if-no-files-found: ignore

      - uses: anthropics/claude-code-action@v1
        if: github.event_name == 'issue_comment'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
