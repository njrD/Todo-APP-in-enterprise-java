name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Only runs on same-repo PRs; fork PRs lack secrets and write access
    if: >
      github.event_name == 'issue_comment' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-action@v1
        if: github.event_name == 'pull_request'
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request and post a single comment using:
            gh pr comment ${{ github.event.pull_request.number }} --body "..."

            The comment must follow this exact structure:

            <!-- claude-review-${{ github.run_id }} -->
            <short summary of 3-5 bullet points covering the most important findings>

            📄 [Download full review](ARTIFACT_URL_PLACEHOLDER)

            <details>
            <summary>Full review</summary>

            ## What Changed
            <concise description of the diff>

            ## Findings
            ### Critical
            <list or "None">
            ### Warnings
            <list or "None">
            ### Suggestions
            <list or "None">

            ## Verdict
            <one line: Approve / Request Changes / Needs Discussion>

            ## Full Review
            <complete narrative review>

            </details>

            Use the literal text ARTIFACT_URL_PLACEHOLDER for the link — it will be replaced with the real download URL after upload.
            Only post the comment via gh — do not output the review as a message.

      - name: Save review as artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="claude-review-${{ github.run_id }}"
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq --arg marker "$MARKER" '[.[] | select(.body | contains($marker))] | last | .id')
          echo "COMMENT_ID=$COMMENT_ID" >> $GITHUB_ENV

          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID \
            --jq '.body' > review-summary.md

      - name: Upload review summary
        if: github.event_name == 'pull_request'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-summary
          path: review-summary.md
          if-no-files-found: warn

      - name: Update comment with artifact link
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ env.COMMENT_ID }} \
            --jq '.body' \
            | python3 -c "
          import sys, os
          body = sys.stdin.read()
          url = os.environ['ARTIFACT_URL']
          print(body.replace('ARTIFACT_URL_PLACEHOLDER', url))
          " > updated_body.md

          gh api repos/${{ github.repository }}/issues/comments/${{ env.COMMENT_ID }} \
            -X PATCH --field body=@updated_body.md

      - uses: anthropics/claude-code-action@v1
        if: >
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@claude')
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue comment:*)"
