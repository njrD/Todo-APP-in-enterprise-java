name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-action@v1
        if: github.event_name == 'pull_request'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-4-5
            --dangerously-skip-permissions
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request and post a single top-level comment using:
            gh pr comment ${{ github.event.pull_request.number }} --body "..."

            Structure the comment exactly like this:

            ## Context
            <repo, PR number, title, author, date>

            ## What Changed
            <concise description of the diff>

            ## Findings
            ### Critical
            <list or "None">
            ### Warnings
            <list or "None">
            ### Suggestions
            <list or "None">

            ## Verdict
            <one line: Approve / Request Changes / Needs Discussion>

            ## Full Review
            <complete narrative review>

            ---
            *A downloadable copy of this review is attached as a workflow artifact named `claude-review-summary`.*

            Only post the comment via gh — do not output the review as a message.

      - name: Save review as artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body' \
            > review-summary.md

      - name: Upload review summary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-summary
          path: review-summary.md
          if-no-files-found: warn

      - uses: anthropics/claude-code-action@v1
        if: github.event_name == 'issue_comment'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --model claude-sonnet-4-5 --dangerously-skip-permissions
