name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Only runs on same-repo PRs; fork PRs lack secrets and write access
    if: >
      github.event_name == 'issue_comment' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-action@2c39411c224657eb2c2b9a146083fd021d72e970 # v1
        if: github.event_name == 'pull_request'
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: |
            {
              "permissions": {
                "allow": ["Bash(gh pr comment:*)", "Bash(gh pr diff:*)", "Bash(gh pr view:*)"],
                "deny": []
              }
            }
          claude_args: --model claude-sonnet-4-6
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Run `gh pr diff ${{ github.event.pull_request.number }}` to get the diff, then review ONLY the changes introduced by this PR — do not review pre-existing code that was not modified.

            Post a single comment using:
            gh pr comment ${{ github.event.pull_request.number }} --body "..."

            The comment must follow this exact structure:

            <!-- claude-review-${{ github.run_id }} -->
            <short summary of 3-5 bullet points covering the most important findings in the diff>

            📄 [Download full review](ARTIFACT_URL_PLACEHOLDER)

            <details>
            <summary>Full review</summary>

            ## What Changed
            <concise description of what the diff introduces>

            ## Findings
            ### Critical
            <list or "None">
            ### Warnings
            <list or "None">
            ### Suggestions
            <list or "None">

            ## Verdict
            <one line: Approve / Request Changes / Needs Discussion>

            ## Full Review
            <complete narrative review scoped to the diff>

            </details>

            Use the literal text ARTIFACT_URL_PLACEHOLDER for the download link.
            Only post via gh — do not output the review as a message.

      - name: Save review as artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="claude-review-${{ github.run_id }}"
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            | jq --arg marker "$MARKER" '[.[] | select(.body | contains($marker))] | last | .id')

          if [ -z "$COMMENT_ID" ] || [ "$COMMENT_ID" = "null" ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body "❌ **Claude review failed** — no comment was posted. Check your Anthropic API credits or [view the action logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo "::error::Claude did not post a review comment. Check API credits or action logs."
            exit 1
          fi

          echo "COMMENT_ID=$COMMENT_ID" >> $GITHUB_ENV
          gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID \
            --jq '.body' > review-summary.md

      - name: Upload review summary
        if: github.event_name == 'pull_request' && env.COMMENT_ID != ''
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-review-summary
          path: review-summary.md
          if-no-files-found: warn

      - name: Update comment with artifact link
        if: github.event_name == 'pull_request' && env.COMMENT_ID != '' && steps.upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ env.COMMENT_ID }} \
            --jq '.body' \
            | python3 -c "
          import sys, os
          body = sys.stdin.read()
          url = os.environ['ARTIFACT_URL']
          print(body.replace('ARTIFACT_URL_PLACEHOLDER', url))
          " > updated_body.md

          gh api repos/${{ github.repository }}/issues/comments/${{ env.COMMENT_ID }} \
            -X PATCH --field body=@updated_body.md

      - uses: anthropics/claude-code-action@2c39411c224657eb2c2b9a146083fd021d72e970 # v1
        if: >
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@claude')
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: |
            {
              "permissions": {
                "allow": ["Bash(gh pr comment:*)", "Bash(gh pr diff:*)", "Bash(gh pr view:*)"],
                "deny": []
              }
            }
          claude_args: --model claude-sonnet-4-6
          prompt: |
            A user commented "@claude" on PR #${{ github.event.issue.number }} in ${{ github.repository }}.

            Their comment: ${{ github.event.comment.body }}

            Respond helpfully in the context of this pull request. Use:
            gh pr comment ${{ github.event.issue.number }} --body "..."
            to post your reply. Only post via gh — do not output as a message.
