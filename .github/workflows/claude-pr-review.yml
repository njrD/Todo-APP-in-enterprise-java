name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-action@v1
        if: github.event_name == 'pull_request'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --model claude-sonnet-4-5 --dangerously-skip-permissions
          prompt: |
            Please review this pull request. Cover:
            - What the PR does (brief summary)
            - Code quality and correctness
            - Potential bugs or edge cases
            - Security concerns
            - Suggestions for improvement

            Structure your PR comment in this exact LLM-friendly format:

            ## Context
            <repo, PR number, title, author, date>

            ## What Changed
            <concise description of the diff>

            ## Findings
            ### Critical
            <list or "None">
            ### Warnings
            <list or "None">
            ### Suggestions
            <list or "None">

            ## Verdict
            <one line: Approve / Request Changes / Needs Discussion>

            ## Full Review
            <complete narrative review>

            ---
            *A downloadable copy of this review is attached as a workflow artifact named `claude-review-summary`.*

      - name: Save review as artifact
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body' \
            > review-summary.md
          echo "" >> review-summary.md
          echo "---" >> review-summary.md
          echo "PR: ${{ github.event.pull_request.html_url }}" >> review-summary.md
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> review-summary.md

      - name: Upload review summary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-summary
          path: review-summary.md
          if-no-files-found: warn

      - uses: anthropics/claude-code-action@v1
        if: github.event_name == 'issue_comment'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --model claude-sonnet-4-5 --dangerously-skip-permissions
